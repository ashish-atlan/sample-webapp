<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mock Atlan Parent — local handshake harness</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fafafa; }
    h1 { font-size: 1rem; margin: 0 0 4px; }
    p.note { margin: 0 0 12px; color: #666; font-size: 0.85rem; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    button { padding: 6px 10px; cursor: pointer; font-size: 0.85rem; }
    iframe { width: 100%; height: 60vh; border: 1px solid #ccc; background: #fff; }
    pre.log { background: #111; color: #0f0; padding: 8px; height: 120px; overflow: auto; margin-top: 12px; font-size: 0.75rem; }
  </style>
</head>
<body>
  <h1>Mock Atlan parent — local handshake harness</h1>
  <p class="note">Use the buttons below to drive the postMessage protocol against the iframe. Watch the dev console and the in-page log for round-trip messages.</p>
  <div class="row">
    <button id="handshake">1. Send ATLAN_HANDSHAKE</button>
    <button id="auth">2. Send ATLAN_AUTH_CONTEXT (asset A)</button>
    <button id="auth2">3. Send ATLAN_AUTH_CONTEXT (asset B)</button>
    <button id="authNoAsset">Send ATLAN_AUTH_CONTEXT (no asset id)</button>
    <button id="logout">Send ATLAN_LOGOUT</button>
    <button id="badOrigin">Spoof from bad origin (should be ignored)</button>
  </div>
  <iframe id="app" src="./" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  <pre class="log" id="log"></pre>
  <script>
    const iframe = document.getElementById('app');
    const logEl = document.getElementById('log');
    const target = window.location.origin;

    const log = (label, data) => {
      const line = `[${new Date().toLocaleTimeString()}] ${label} ${typeof data === 'string' ? data : JSON.stringify(data)}\n`;
      logEl.textContent += line;
      logEl.scrollTop = logEl.scrollHeight;
    };

    const post = (msg) => {
      log('parent →', msg);
      iframe.contentWindow.postMessage(msg, target);
    };

    const authMsg = (assetId) => ({
      type: 'ATLAN_AUTH_CONTEXT',
      payload: {
        token: 'mock-jwt-token',
        expiresAt: Math.floor(Date.now() / 1000) + 3600,
        user: {
          id: 'u-123',
          username: 'ashish.desai',
          email: 'ashish.desai@example.com',
          name: 'Ashish Desai',
        },
        page: {
          route: assetId ? '/assets/:id' : '/external/sample-webapp',
          params: assetId ? { id: assetId } : {},
          query: {},
        },
        timestamp: Date.now(),
      },
    });

    document.getElementById('handshake').onclick = () =>
      post({ type: 'ATLAN_HANDSHAKE', appId: 'sample-webapp' });
    document.getElementById('auth').onclick = () =>
      post(authMsg('00000000-0000-0000-0000-000000000001'));
    document.getElementById('auth2').onclick = () =>
      post(authMsg('11111111-2222-3333-4444-555555555555'));
    document.getElementById('authNoAsset').onclick = () =>
      post(authMsg(null));
    document.getElementById('logout').onclick = () =>
      post({ type: 'ATLAN_LOGOUT' });

    // Open a popup on a different origin and post from there to verify the
    // origin allowlist drops it. The popup is required because postMessage
    // origin is determined by the calling window's origin.
    document.getElementById('badOrigin').onclick = () => {
      const html = `<script>
        window.opener.document.getElementById('app').contentWindow
          .postMessage({ type: 'ATLAN_AUTH_CONTEXT', payload: { user: { username: 'attacker' } } }, '*');
        window.close();
      <\\/script>`;
      const blob = new Blob([html], { type: 'text/html' });
      window.open(URL.createObjectURL(blob), '_blank', 'width=300,height=200');
      log('parent', 'spawned spoof window — iframe should ignore the message');
    };

    window.addEventListener('message', (e) => {
      if (e.origin !== target) {
        log('parent IGNORED (bad origin)', { origin: e.origin, data: e.data });
        return;
      }
      log('iframe →', e.data);
    });
  </script>
</body>
</html>
